[project]
name = "py-filesorter"
version = "0.1.0"
description = "Py-FileSorter is a lightweight Python utility that organizes files into subdirectories based on their file extensions."
readme = "README.md"
authors = [
    { name = "Akisolu", email = "morillomiguel2707@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
py-filesorter = "sorter:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sorter --cov-report=term-missing"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
